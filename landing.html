<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perex Store - عرض خاص</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css?v=1.1">
    <style id="dynamic-colors"></style>
    <style>
        .landing-page { padding-top: 100px; padding-bottom: 100px; }
        .product-hero { display: grid; grid-template-columns: 1fr 1fr; gap: 60px; align-items: start; }
        .product-gallery { position: sticky; top: 120px; }
        .main-img-wrap { border-radius: var(--border-radius); overflow: hidden; box-shadow: var(--shadow-premium); background: var(--card-bg); position: relative; }
        .landing-checkout { background: var(--card-bg); padding: 40px; border-radius: var(--border-radius); border: 1px solid var(--glass-border); margin-top: 30px; }
        .price-tag { display: flex; align-items: center; gap: 15px; margin: 20px 0; }
        .price-tag .new { font-size: 2.8rem; font-weight: 800; color: var(--primary-color); }
        .price-tag .old { font-size: 1.6rem; color: var(--text-muted); text-decoration: line-through; }
        .features-list { margin: 30px 0; }
        .features-list li { display: flex; align-items: center; gap: 12px; margin-bottom: 15px; color: var(--text-color); font-size: 1.05rem; }
        .features-list i { color: #22c55e; font-size: 1.2rem; }
        
        @media (max-width: 992px) {
            .product-hero { grid-template-columns: 1fr; gap: 40px; }
            .product-gallery { position: relative; top: 0; max-width: 600px; margin: 0 auto; }
            .price-tag .new { font-size: 2.2rem; }
            .landing-checkout { padding: 25px; }
        }
    </style>
</head>
<body class="landing-page">

    <header class="header scrolled">
        <div class="container nav-container">
            <a href="index.html" class="logo">
                <img src="prerx logo.jpeg" alt="Logo">
                <span>Perex Store</span>
            </a>
            <a href="index.html" class="btn btn-secondary">العودة للمتجر</a>
        </div>
    </header>

    <div class="container" style="margin-top: 50px;">
        <div id="landing-content" class="product-hero">
            <!-- Content will be loaded by landing.js -->
            <div style="text-align: center; grid-column: 1/-1; padding: 100px;">
                <i class="fa-solid fa-circle-notch fa-spin" style="font-size: 3rem; color: var(--primary-color);"></i>
            </div>
        </div>
    </div>

    <!-- Success Modal -->
    <style>
        @keyframes slideDown {
            from { transform: translateY(-100%); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        .success-animate {
            animation: slideDown 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10001;
            background: rgba(0,0,0,0.4);
            backdrop-filter: blur(2px);
            display: none;
            justify-content: center;
            align-items: flex-start;
            padding-top: 20px;
        }
        .modal-overlay.active {
            display: flex !important;
        }
    </style>
    <div id="success-overlay" class="modal-overlay">
        <div id="success-modal" class="modal success-animate" style="max-width: 400px; width: 90%; text-align: center; padding: 20px; border-radius: 15px; border: 1px solid rgba(34,197,94,0.3); box-shadow: 0 15px 40px rgba(0,0,0,0.2); background: var(--card-bg); position: relative;">
            <div style="display: flex; align-items: center; gap: 12px; text-align: right;">
                <div style="width: 40px; height: 40px; background: #22c55e; color: #fff; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 18px; flex-shrink: 0;">
                    <i class="fa-solid fa-check"></i>
                </div>
                <div style="flex: 1;">
                    <h2 style="font-size: 1.1rem; font-weight: 800; margin-bottom: 2px;">تم تأكيد طلبك بنجاح!</h2>
                    <p style="color: var(--muted-color); font-size: 0.85rem;">سيتم التواصل معك في أسرع وقت ممكن.</p>
                </div>
            </div>
            <button class="btn btn-primary" onclick="closeSuccessModal()" style="width: 100%; margin-top: 15px; padding: 10px; border-radius: 10px; font-weight: bold; font-size: 0.9rem;">تم</button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-client.js"></script>
<script src="landing.js?v=1.1"></script>
</body>
</html>
